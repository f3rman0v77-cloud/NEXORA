name: Generate original NEXORA PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - nexora.png
      - .github/workflows/pwa-icons.yml
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Resize original logo without replacement
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('nexora.png').convert('RGBA')
          for size in (192,512):
              output=Image.new('RGBA',(size,size),(0,0,0,0))
              thumbnail=im.copy()
              thumbnail.thumbnail((size,size),Image.Resampling.LANCZOS)
              output.alpha_composite(thumbnail,((size-thumbnail.width)//2,(size-thumbnail.height)//2))
              output.save(f'nexora-{size}.png')
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexora-192.png nexora-512.png
          if ! git diff --cached --quiet; then git commit -m "Generate PWA icons from original NEXORA logo"; git push; fi
